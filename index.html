<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>anotAI — Gestão de aulas particulares</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body class="booting">

<div id="boot-gate">
  <div class="boot-gate-mark">
    <img src="assets/logo.png" alt="anotAI" class="boot-gate-logo-img"
         onerror="this.style.display='none';this.nextElementSibling.style.display='inline-block';" />
    <span class="boot-gate-logo-fallback" style="display:none">anotAI</span>
  </div>
</div>

<div id="shell">
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-logo">
        <img src="assets/logo.png" alt="anotAI" class="brand-logo-img"
             onerror="this.style.display='none';this.nextElementSibling.style.display='inline-block';" />
        <span class="brand-logo-fallback" style="display:none">anotAI</span>
      </div>
    </div>
    <nav class="nav">
      <button class="nav-item" data-nav="home" data-action="nav-home"><span id="nav-icon-home"></span>Início</button>
      <button class="nav-item" data-nav="agenda" data-action="nav-agenda"><span id="nav-icon-agenda"></span>Agenda</button>
      <button class="nav-item" data-nav="clientes" data-action="nav-clientes"><span id="nav-icon-clientes"></span>Clientes</button>
      <button class="nav-item" data-nav="grade" data-action="nav-grade"><span id="nav-icon-grade"></span>Grade</button>
    </nav>
    <div class="sidebar-footer">
      <button class="btn-primary" data-action="nav-new-contract"><span id="sidebar-plus-icon"></span>Nova contratação</button>
      <button class="nav-item" data-nav="settings" data-action="nav-settings"><span id="nav-icon-settings"></span>Perfil</button>
    </div>
  </aside>

  <div id="main">
    <header id="topbar">
      <div>
        <div class="page-title" id="page-title">Início</div>
        <div class="page-sub" id="page-sub"></div>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="profile-btn" data-action="nav-settings" aria-label="Perfil">
          <span id="account-icon"></span>
        </button>
        <button class="icon-btn" id="bell-btn" data-action="open-notifications" aria-label="Notificações">
          <span id="bell-icon"></span>
          <span class="badge-count" id="bell-count" style="display:none"></span>
        </button>
      </div>
    </header>
    <main id="content" class="scroll-thin"></main>
  </div>

  <nav id="mobile-nav">
    <button class="mnav-item" data-nav="home" data-action="nav-home"><span id="mnav-home"></span>Início</button>
    <button class="mnav-item" data-nav="agenda" data-action="nav-agenda"><span id="mnav-agenda"></span>Agenda</button>
    <button class="mnav-item highlight" data-action="nav-new-contract"><span id="mnav-plus"></span>Novo</button>
    <button class="mnav-item" data-nav="grade" data-action="nav-grade"><span id="mnav-grade"></span>Grade</button>
    <button class="mnav-item" data-nav="clientes" data-action="nav-clientes"><span id="mnav-clientes"></span>Mais</button>
  </nav>
</div>

<div class="overlay" id="overlay"></div>

<!-- Drawer: notificações -->
<div class="drawer" id="notif-drawer">
  <div class="drawer-head">
    <h2>Notificações</h2>
    <button class="drawer-close" data-action="close-drawer" aria-label="Fechar">✕</button>
  </div>
  <div class="drawer-body scroll-thin" id="notif-drawer-body"></div>
</div>

<!-- Drawer: painel rápido do evento -->
<div class="drawer" id="quick-drawer">
  <div class="drawer-head">
    <h2>Resumo do evento</h2>
    <button class="drawer-close" data-action="close-drawer" aria-label="Fechar">✕</button>
  </div>
  <div class="drawer-body scroll-thin quick-panel" id="quick-drawer-body"></div>
</div>

<!-- Modal: nova contratação -->
<div class="modal-wrap" id="modal-new-contract">
  <div class="modal">
    <div class="modal-head">
      <div>
        <h2>Nova contratação</h2>
        <p>Apenas nome e telefone são obrigatórios.</p>
      </div>
      <button class="modal-close" data-action="close-modal" aria-label="Fechar">✕</button>
    </div>
    <form data-action="create-contract">
      <label class="field">Nome *<input class="input" id="ncf-name" required placeholder="Nome do cliente" /></label>
      <label class="field">Telefone *<input class="input" id="ncf-phone" required placeholder="(11) 91234-5678" /></label>
      <div class="form-row2">
        <label class="field">Data<input class="input" type="date" id="ncf-date" /></label>
        <label class="field">Horário<input class="input" type="time" id="ncf-time" /></label>
      </div>
      <div id="ncf-avail"></div>
      <button type="submit" class="btn-primary" style="margin-top:4px;width:100%">Criar contratação</button>
    </form>
  </div>
</div>

<!-- Modal: adicionar aula -->
<div class="modal-wrap" id="modal-add-lesson">
  <div class="modal">
    <div class="modal-head">
      <div>
        <h2>Adicionar aula</h2>
        <p>Data e horário são opcionais — dá para preencher depois.</p>
      </div>
      <button class="modal-close" data-action="close-modal" aria-label="Fechar">✕</button>
    </div>
    <form data-action="create-lesson">
      <div id="modal-add-lesson-body"></div>
      <button type="submit" class="btn-primary" style="margin-top:4px;width:100%">Adicionar aula</button>
    </form>
  </div>
</div>

<!-- Modal: confirmação genérica -->
<div class="modal-wrap" id="modal-confirm">
  <div class="modal" style="width:400px">
    <div class="modal-head">
      <div>
        <h2>Confirmar ação</h2>
        <p id="confirm-message" style="margin-top:10px"></p>
      </div>
    </div>
    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button class="btn-secondary" data-action="confirm-cancel">Cancelar</button>
      <button class="btn-primary btn-danger-solid" id="confirm-ok-btn" data-action="confirm-ok">Confirmar</button>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toast-wrap"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/data.js"></script>
<script src="js/icons.js"></script>
<script src="js/helpers.js"></script>
<script src="js/db.js"></script>
<script src="js/render-home.js"></script>
<script src="js/render-agenda.js"></script>
<script src="js/render-clients.js"></script>
<script src="js/render-lesson.js"></script>
<script src="js/render-grade.js"></script>
<script src="js/render-ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
