<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>The Sen5es — Gestão de Eventos Bike</title>
<style>
:root{
  --bg:#111313;
  --surface:#1A1D1D;
  --elevated:#202424;
  --elevated2:#252929;
  --tiffany:#5EDBC8;
  --tiffany-dim:#3EA997;
  --tiffany-soft:rgba(94,219,200,.12);
  --text:#F3F5F4;
  --text2:#969D9C;
  --muted:#6B7170;
  --border:#282B2B;
  --border-subtle:#1F2222;
  --st-interest:#E8C468;
  --st-alignment:#6FA8DC;
  --st-quote:#B18AE0;
  --st-pre:#E29A5A;
  --st-confirmed:#5FBF7A;
  --st-completed:#8A9190;
  --st-cancelled:#E06A6A;
  --radius:10px;
  --radius-lg:16px;
  --radius-sm:6px;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  font-feature-settings:"tnum" 1;
}
h1,h2,h3,p{margin:0;}
button{font-family:inherit;font-size:inherit;cursor:pointer;}
a{color:inherit;text-decoration:none;}
input,select,textarea{font-family:inherit;font-size:inherit;}
::selection{background:rgba(94,219,200,.3);}

.scroll-thin::-webkit-scrollbar{width:6px;height:6px;}
.scroll-thin::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}

/* ---------- shell ---------- */
#shell{display:flex;min-height:100vh;}

/* ---------- sidebar (desktop) ---------- */
#sidebar{
  width:220px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);
  padding:24px 16px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
}
.brand{padding:0 8px 28px;}
.brand-mark{font-size:14px;font-weight:600;letter-spacing:.2px;color:var(--text);}
.brand-sub{font-size:11px;color:var(--muted);margin-top:2px;}
.nav{display:flex;flex-direction:column;gap:2px;flex:1;}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius-sm);
  color:var(--text2);font-size:13.5px;border:none;background:transparent;width:100%;text-align:left;
  transition:background .15s,color .15s;
}
.nav-item svg{width:16px;height:16px;flex-shrink:0;opacity:.85;}
.nav-item:hover{background:var(--elevated);color:var(--text);}
.nav-item.active{background:var(--tiffany-soft);color:var(--tiffany);}
.nav-item.active svg{opacity:1;}
.sidebar-footer{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--border);padding-top:16px;margin-top:12px;}
.btn-primary{
  background:var(--tiffany);color:#0B1211;border:none;border-radius:var(--radius-sm);
  padding:9px 12px;font-size:13.5px;font-weight:600;text-align:center;transition:opacity .15s;
}
.btn-primary:hover{opacity:.9;}

/* ---------- main / header ---------- */
#main{flex:1;min-width:0;display:flex;flex-direction:column;}
#topbar{
  display:flex;align-items:center;justify-content:space-between;padding:16px 32px;
  border-bottom:1px solid var(--border);gap:16px;
}
#topbar .page-title{font-size:15px;font-weight:600;color:var(--text);}
#topbar .page-sub{font-size:12.5px;color:var(--text2);margin-top:2px;}
.topbar-actions{display:flex;align-items:center;gap:10px;}

.icon-btn{
  position:relative;width:36px;height:36px;border-radius:50%;border:none;background:transparent;
  display:flex;align-items:center;justify-content:center;color:var(--text2);transition:background .15s,color .15s;
}
.icon-btn:hover{background:var(--elevated);color:var(--text);}
.icon-btn svg{width:18px;height:18px;}
.badge-count{
  position:absolute;top:-2px;right:-2px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;
  background:var(--st-pre);color:#1a0f00;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;
}

#content{flex:1;padding:28px 32px 96px;max-width:1100px;width:100%;}

/* ---------- page visibility ---------- */
.page{display:none;}
.page.active{display:block;animation:fadein .18s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

/* ---------- typography helpers ---------- */
.section-title{font-size:16px;font-weight:600;color:var(--text);}
.section-sub{font-size:13px;color:var(--text2);margin-top:4px;}
.block-title{font-size:13px;font-weight:600;color:var(--text2);text-transform:none;}
.muted{color:var(--muted);}
.text2{color:var(--text2);}

/* ---------- status badge ---------- */
.badge{
  display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:5px;
  font-size:11.5px;font-weight:600;white-space:nowrap;
}
.badge .dot{width:6px;height:6px;border-radius:50%;}
.badge.interest{color:var(--st-interest);background:rgba(232,196,104,.13);}
.badge.interest .dot{background:var(--st-interest);}
.badge.alignment{color:var(--st-alignment);background:rgba(111,168,220,.13);}
.badge.alignment .dot{background:var(--st-alignment);}
.badge.quote{color:var(--st-quote);background:rgba(177,138,224,.13);}
.badge.quote .dot{background:var(--st-quote);}
.badge.pre_reservation{color:var(--st-pre);background:rgba(226,154,90,.15);}
.badge.pre_reservation .dot{background:var(--st-pre);}
.badge.confirmed{color:var(--st-confirmed);background:rgba(95,191,122,.15);}
.badge.confirmed .dot{background:var(--st-confirmed);}
.badge.completed{color:var(--st-completed);background:rgba(138,145,144,.15);}
.badge.completed .dot{background:var(--st-completed);}
.badge.cancelled{color:var(--st-cancelled);background:rgba(224,106,106,.15);}
.badge.cancelled .dot{background:var(--st-cancelled);}

/* ---------- cards ---------- */
.card{
  background:var(--surface);border:1px solid var(--border-subtle);border-radius:var(--radius);
  transition:border-color .15s;
}
.card:hover{border-color:var(--border);}
.event-card{
  display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer;
}
.event-card .stripe{width:4px;align-self:stretch;border-radius:3px;flex-shrink:0;min-height:34px;}
.event-card .main{flex:1;min-width:0;}
.event-card .name{font-size:13.5px;font-weight:600;color:var(--text);}
.event-card .meta{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin-top:5px;font-size:12.5px;color:var(--text2);}
.event-card .pay{margin-top:5px;font-size:11.5px;color:var(--muted);}
.event-card .go{font-size:12.5px;color:var(--text2);opacity:0;transition:opacity .15s;flex-shrink:0;}
.event-card:hover .go{opacity:1;}

.empty-state{
  border:1px dashed var(--border);border-radius:var(--radius);padding:26px;text-align:center;
  color:var(--text2);font-size:13px;
}

/* ---------- home ---------- */
.home-wrap{max-width:640px;}
.home-list{display:flex;flex-direction:column;gap:8px;margin-top:18px;}
.home-section-label{font-size:13px;font-weight:600;color:var(--text2);margin:28px 0 10px;}
.sem-data .event-card{opacity:.78;}

/* ---------- agenda ---------- */
.agenda-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;}
.month-nav{display:flex;align-items:center;gap:14px;}
.month-nav button{
  width:30px;height:30px;border-radius:50%;border:1px solid var(--border);background:transparent;color:var(--text2);
  display:flex;align-items:center;justify-content:center;transition:.15s;
}
.month-nav button:hover{border-color:var(--tiffany-dim);color:var(--text);}
.month-label{font-size:14.5px;font-weight:600;min-width:150px;text-align:center;}

.tabs{display:flex;gap:4px;margin-top:20px;border-bottom:1px solid var(--border);overflow-x:auto;}
.tab-btn{
  padding:10px 14px;font-size:13px;color:var(--text2);background:none;border:none;border-bottom:2px solid transparent;
  white-space:nowrap;transition:color .15s,border-color .15s;
}
.tab-btn:hover{color:var(--text);}
.tab-btn.active{color:var(--tiffany);border-color:var(--tiffany);}

.agenda-body{margin-top:20px;}
.list-view{display:flex;flex-direction:column;gap:8px;}

/* ---------- calendar ---------- */
.cal-wrap{margin-top:4px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px;}
.cal-dow{font-size:11px;color:var(--muted);text-align:center;padding-bottom:4px;font-weight:600;}
.cal-cell{
  min-height:92px;border:1px solid var(--border-subtle);border-radius:var(--radius-sm);padding:6px;
  background:var(--surface);cursor:pointer;display:flex;flex-direction:column;gap:4px;transition:border-color .15s,background .15s;
}
.cal-cell:hover{border-color:var(--tiffany-dim);}
.cal-cell.outside{opacity:.3;cursor:default;}
.cal-cell.outside:hover{border-color:var(--border-subtle);}
.cal-cell.today{border-color:var(--tiffany);}
.cal-daynum{font-size:11.5px;color:var(--text2);}
.cal-chip{
  font-size:10.5px;padding:2px 5px;border-radius:4px;background:var(--elevated2);color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid var(--tiffany);
}
.cal-more{font-size:10px;color:var(--muted);}

/* ---------- weekly grid ---------- */
.week-toolbar{display:flex;align-items:center;justify-content:space-between;margin-top:18px;}
.week-grid{margin-top:14px;border:1px solid var(--border-subtle);border-radius:var(--radius);overflow:hidden;}
.week-row{display:grid;grid-template-columns:64px repeat(var(--cols,5),1fr);border-top:1px solid var(--border-subtle);}
.week-row:first-child{border-top:none;}
.week-row.head{background:var(--elevated);}
.week-cell{padding:8px 8px;border-left:1px solid var(--border-subtle);min-height:46px;display:flex;align-items:center;}
.week-cell:first-child{border-left:none;}
.week-hour{font-size:11px;color:var(--muted);justify-content:flex-end;padding-right:10px;}
.week-head-cell{font-size:11.5px;color:var(--text2);font-weight:600;justify-content:center;flex-direction:column;gap:1px;text-align:center;}
.week-head-cell .num{color:var(--text);font-size:13px;}
.slot{width:100%;border-radius:6px;padding:5px 7px;font-size:11px;line-height:1.3;cursor:default;}
.slot.free{color:var(--muted);}
.slot.fixed{background:var(--elevated2);color:var(--text2);opacity:.65;cursor:default;}
.slot.pre{cursor:pointer;border-left:3px solid var(--client);background:color-mix(in srgb, var(--client) 16%, var(--surface));color:var(--text);}
.slot.confirmed{cursor:pointer;border-left:3px solid var(--client);background:color-mix(in srgb, var(--client) 34%, var(--surface));color:var(--text);font-weight:600;}

/* day view (mobile detail) */
.day-list{display:flex;flex-direction:column;gap:6px;margin-top:14px;}
.day-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--radius-sm);border:1px solid var(--border-subtle);}
.day-row .hour{width:44px;font-size:12px;color:var(--muted);flex-shrink:0;}
.day-row.fixed{opacity:.6;}
.day-row.pre,.day-row.confirmed{cursor:pointer;border-left:3px solid var(--client);}

/* ---------- blocks (contract / lesson pages) ---------- */
.page-header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap;}
.breadcrumb{font-size:12.5px;color:var(--text2);margin-bottom:6px;}
.breadcrumb a{color:var(--text2);}
.breadcrumb a:hover{color:var(--tiffany);}
.blocks{display:flex;flex-direction:column;gap:14px;max-width:680px;}
.block{background:var(--surface);border:1px solid var(--border-subtle);border-radius:var(--radius);padding:18px 20px;}
.block-head{display:flex;align-items:center;justify-content:space-between;}
.block-edit{font-size:12.5px;color:var(--tiffany);background:none;border:none;}
.block-edit:hover{text-decoration:underline;}
.dl-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px;}
.dl-grid dt{font-size:11px;color:var(--muted);}
.dl-grid dd{margin:3px 0 0;font-size:13px;color:var(--text);}

.lesson-card{
  display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;
  border:1px solid var(--border-subtle);border-radius:var(--radius-sm);cursor:pointer;transition:border-color .15s;margin-top:8px;
}
.lesson-card:first-of-type{margin-top:14px;}
.lesson-card:hover{border-color:var(--border);}
.lesson-card .lname{font-size:13px;font-weight:600;color:var(--text);}
.lesson-card .ldate{margin-left:8px;color:var(--text2);font-weight:400;}
.lesson-card .lright{display:flex;align-items:center;gap:10px;}
.add-lesson{
  margin-top:12px;width:100%;padding:10px;border:1px dashed var(--border);border-radius:var(--radius-sm);
  background:none;color:var(--text2);font-size:13px;transition:.15s;
}
.add-lesson:hover{border-color:var(--tiffany-dim);color:var(--tiffany);}

.teacher-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-top:1px solid var(--border-subtle);}
.teacher-row:first-of-type{border-top:none;margin-top:12px;}
.teacher-name{font-size:13px;color:var(--text);}
.teacher-status{font-size:12px;font-weight:600;}
.ts-not_contacted{color:var(--muted);}
.ts-waiting{color:var(--st-interest);}
.ts-available{color:var(--st-confirmed);}
.ts-unavailable{color:var(--st-cancelled);}

.complement-row{display:flex;justify-content:space-between;padding:6px 0;font-size:13px;}
.complement-row span:first-child{color:var(--text2);}

.timeline{display:flex;flex-direction:column;margin-top:14px;}
.tl-item{position:relative;padding:0 0 18px 20px;}
.tl-item:last-child{padding-bottom:0;}
.tl-item::before{content:"";position:absolute;left:3px;top:5px;width:6px;height:6px;border-radius:50%;background:var(--tiffany-dim);}
.tl-item::after{content:"";position:absolute;left:5.5px;top:13px;bottom:0;width:1px;background:var(--border);}
.tl-item:last-child::after{display:none;}
.tl-time{font-size:11.5px;color:var(--muted);}
.tl-text{font-size:13px;color:var(--text);margin-top:2px;}
.add-note{margin-top:14px;display:flex;gap:8px;}
.add-note input{flex:1;}
.add-note button{white-space:nowrap;}

.feedback-img{
  width:100%;max-width:260px;border-radius:var(--radius-sm);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;background:var(--elevated);color:var(--muted);
  font-size:12px;height:170px;margin-top:12px;
}

/* ---------- forms ---------- */
label.field{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--text2);}
.input,select.input,textarea.input{
  background:var(--elevated);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:9px 11px;color:var(--text);outline:none;transition:border-color .15s;width:100%;
}
.input:focus{border-color:var(--tiffany);}
.input::placeholder{color:var(--muted);}
.form-row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.btn-secondary{
  background:none;border:1px solid var(--border);color:var(--text2);border-radius:var(--radius-sm);
  padding:9px 14px;font-size:13px;transition:.15s;
}
.btn-secondary:hover{color:var(--text);border-color:var(--text2);}
.btn-link{background:none;border:none;color:var(--tiffany);font-size:13px;padding:0;}
.btn-link:hover{text-decoration:underline;}

.avail-box{margin-top:10px;padding:10px 12px;border:1px solid var(--border-subtle);border-radius:var(--radius-sm);font-size:12.5px;background:var(--elevated);}
.avail-ok{color:var(--st-confirmed);}
.avail-warn{color:var(--st-pre);}
.avail-hard{color:var(--st-cancelled);}

/* ---------- overlay / drawer / modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;opacity:0;pointer-events:none;transition:opacity .18s;}
.overlay.show{opacity:1;pointer-events:auto;}

.drawer{
  position:fixed;top:0;right:0;height:100%;width:380px;max-width:92vw;background:var(--surface);
  border-left:1px solid var(--border);z-index:50;transform:translateX(100%);transition:transform .2s ease;
  display:flex;flex-direction:column;
}
.drawer.show{transform:translateX(0);}
.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--border);}
.drawer-head h2{font-size:14px;font-weight:600;}
.drawer-close{background:none;border:none;color:var(--text2);width:28px;height:28px;border-radius:50%;}
.drawer-close:hover{background:var(--elevated);color:var(--text);}
.drawer-body{flex:1;overflow-y:auto;padding:16px 20px;}

.notif-item{border:1px solid var(--border-subtle);border-radius:var(--radius-sm);padding:12px;margin-bottom:12px;}
.notif-kind{font-size:10.5px;letter-spacing:.3px;color:var(--muted);}
.notif-msg{font-size:13px;color:var(--text);margin-top:5px;}
.notif-link{margin-top:8px;display:inline-block;font-size:12.5px;color:var(--tiffany);}
.notif-link:hover{text-decoration:underline;}

.quick-panel{padding:0;}
.qp-number{font-size:13px;font-weight:600;color:var(--text);}
.qp-datetime{font-size:13px;color:var(--text2);margin-top:6px;}
.qp-badge{margin-top:10px;}
.qp-row{display:flex;justify-content:space-between;margin-top:14px;font-size:12.5px;padding-top:12px;border-top:1px solid var(--border-subtle);}
.qp-row .k{color:var(--muted);}
.qp-row .v{color:var(--text);}
.qp-open{margin-top:18px;width:100%;}

.modal-wrap{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .18s;}
.modal-wrap.show{opacity:1;pointer-events:auto;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);width:420px;max-width:100%;max-height:90vh;overflow-y:auto;padding:26px 26px 22px;}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px;}
.modal-head h2{font-size:15.5px;font-weight:600;}
.modal-head p{margin-top:4px;color:var(--text2);font-size:12.5px;}
.modal-close{background:none;border:none;color:var(--text2);width:26px;height:26px;flex-shrink:0;}
.modal form{display:flex;flex-direction:column;gap:14px;}

.toast-wrap{position:fixed;bottom:20px;right:20px;z-index:80;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--elevated2);border:1px solid var(--border);color:var(--text);padding:11px 16px;border-radius:var(--radius-sm);font-size:13px;box-shadow:0 8px 30px rgba(0,0,0,.45);animation:toastin .18s ease;}
@keyframes toastin{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

/* ---------- mobile ---------- */
#mobile-nav{display:none;}
.mobile-topbar{display:none;}

@media (max-width:860px){
  #sidebar{display:none;}
  #topbar{padding:14px 16px;}
  #content{padding:18px 16px 90px;}
  .dl-grid{grid-template-columns:1fr;}
  .form-row2{grid-template-columns:1fr;}
  .drawer{width:100%;max-width:100%;}

  #mobile-nav{
    display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--surface);
    border-top:1px solid var(--border);z-index:35;padding-bottom:env(safe-area-inset-bottom);
  }
  .mnav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;background:none;border:none;color:var(--text2);font-size:10.5px;}
  .mnav-item svg{width:19px;height:19px;}
  .mnav-item.active{color:var(--tiffany);}
  .mnav-item.highlight{color:var(--tiffany);}

  .cal-grid{gap:4px;}
  .cal-cell{min-height:64px;padding:5px;}
  .cal-chip{font-size:9.5px;}
}


/* ======================= REFINAMENTO VISUAL V1.1 ======================= */
:root{
  --bg:#0B0E0E;
  --surface:#121616;
  --elevated:#181D1D;
  --elevated2:#1E2424;
  --tiffany:#62E2CE;
  --tiffany-dim:#45B9A7;
  --tiffany-soft:rgba(98,226,206,.10);
  --text:#F4F7F6;
  --text2:#A5AEAC;
  --muted:#717B79;
  --border:#26302F;
  --border-subtle:#1A2221;
  --radius:12px;
  --radius-lg:20px;
  --radius-sm:8px;
}
body{
  background:
    radial-gradient(circle at 78% -12%, rgba(98,226,206,.06), transparent 27rem),
    linear-gradient(180deg,#0B0E0E 0%,#0D1010 100%);
  letter-spacing:-.005em;
}
#sidebar{
  width:236px;
  background:rgba(16,20,20,.94);
  border-right:1px solid rgba(255,255,255,.055);
  padding:28px 18px 22px;
  backdrop-filter:blur(18px);
}
.brand{padding:0 10px 34px;}
.brand-mark{font-size:15px;letter-spacing:.18em;font-weight:650;}
.brand-the{font-size:9px;letter-spacing:.14em;color:var(--tiffany);vertical-align:2px;margin-right:3px;}

#content{padding:36px 40px 104px;max-width:1280px;}
.section-title{font-size:22px;line-height:1.2;letter-spacing:-.025em;font-weight:620;}
.section-sub{font-size:12.5px;color:var(--muted);margin-top:7px;}
.block-title{font-size:11px;text-transform:uppercase;letter-spacing:.10em;color:var(--muted);font-weight:650;}
.card,.block{background:linear-gradient(145deg,rgba(19,24,24,.98),rgba(15,19,19,.98));border:1px solid rgba(255,255,255,.055);box-shadow:0 12px 34px rgba(0,0,0,.10);}

.event-card .name{font-size:14px;font-weight:620;}
.event-card .meta{margin-top:7px;gap:10px;}
.event-card .pay{margin-top:7px;font-size:11.5px;color:var(--muted);}

.icon-btn:hover{background:var(--elevated);border-color:var(--border-subtle);}
.badge-count{background:var(--tiffany);color:#06110F;box-shadow:0 0 0 2px var(--bg);}

.tab-btn{padding:11px 15px;font-size:12.5px;}
.month-label{font-size:15px;}
.cal-grid{gap:7px;margin-top:16px;}
.cal-dow{font-size:9.5px;letter-spacing:.11em;color:var(--muted);}
.cal-cell{min-height:104px;border-color:rgba(255,255,255,.045);background:rgba(18,22,22,.72);padding:8px;border-radius:10px;}
.cal-cell:hover{background:rgba(22,28,27,.94);box-shadow:inset 0 0 0 1px rgba(98,226,206,.12);}

.cal-daynum{font-size:11px;font-weight:600;}

.week-cell{border-left-color:rgba(255,255,255,.045);min-height:52px;padding:8px 9px;}

const SHORT_MONTHS = ['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];
function fmtDateShort(iso){
  if(!iso) return '—';
  const [,m,d] = iso.split('-').map(Number);
  return `${pad2(d)} ${SHORT_MONTHS[m-1]}`;
}
function fmtCurrency(v){
  if(v === null || v === undefined) return '—';
  return v.toLocaleString('pt-BR', { style:'currency', currency:'BRL' });
}
function fmtPhone(phone){
  const digits = (phone||'').replace(/\D/g,'');
  if(digits.length===11) return `(${digits.slice(0,2)}) ${digits.slice(2,7)}-${digits.slice(7)}`;
  if(digits.length===10) return `(${digits.slice(0,2)}) ${digits.slice(2,6)}-${digits.slice(6)}`;
  return phone || '—';
}
function fmtNoteTimestamp(iso){
  const d = new Date(iso);
  const date = `${pad2(d.getDate())}/${pad2(d.getMonth()+1)}`;
  const time = `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
  return `${date} · ${time}`;
}
function clientColor(displayNumber){
  return CLIENT_COLORS[(displayNumber - 1) % CLIENT_COLORS.length];
}
function daysUntil(iso){
  const today = new Date(DEMO_TODAY + 'T00:00:00');
  const target = new Date(iso + 'T00:00:00');
  return Math.round((target - today) / 86400000);
}
function weekdayFromDate(iso){
  const [y,m,d] = iso.split('-').map(Number);
  const jsDay = new Date(Date.UTC(y, m-1, d, 12)).getUTCDay(); // 0=Sun..6=Sat
  const names = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
  return names[jsDay];
}
function isoAddDays(iso, days){
  const d = new Date(iso + 'T00:00:00');
  d.setDate(d.getDate() + days);
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
}
function mondayOf(iso){
  const [y,m,d] = iso.split('-').map(Number);
  const jsDay = new Date(Date.UTC(y,m-1,d,12)).getUTCDay(); // 0=Sun..6=Sat
  const diffToMonday = jsDay === 0 ? -6 : 1 - jsDay;
  return isoAddDays(iso, diffToMonday);
}

/* ---------- flatten helpers ---------- */
function allLessonsFlat(){
  const out = [];
  for(const c of CONTRACTS){
    for(const l of c.lessons){
      out.push({ lesson: l, contract: c });
    }
  }
  return out;
}
function getContractById(id){ return CONTRACTS.find(c => c.id === id) || null; }
function getLessonRef(contractId, lessonId){
  const c = getContractById(contractId);
  if(!c) return null;
  const l = c.lessons.find(x => x.id === lessonId);
  return l ? { contract:c, lesson:l } : null;
}
const ACTIVE_STATUSES = ['interest','alignment','quote','pre_reservation','confirmed'];
const INTEREST_STAGE = ['interest','alignment','quote'];

/* ---------- scheduling (mesma lógica do app real, em JS puro) ---------- */
const PRIVATE_PREP = 20, PRIVATE_CLASS = 50, PRIVATE_WRAP = 20;
const FIXED_TOTAL = 60;

function timeToMin(hhmm){ const [h,m] = hhmm.split(':').map(Number); return h*60+m; }
function minToTime(total){
  const n = ((total % 1440) + 1440) % 1440;
  return `${pad2(Math.floor(n/60))}:${pad2(n%60)}`;
}
function fixedOcc(start){ const s = timeToMin(start); return { start:s, end:s+FIXED_TOTAL }; }
function privateOcc(actualStart){ const s = timeToMin(actualStart); return { start: s-PRIVATE_PREP, end: s+PRIVATE_CLASS+PRIVATE_WRAP }; }
function overlaps(a,b){ return a.start < b.end && b.start < a.end; }

function calcAvailability(date, baseTime, excludeLessonId){
  const weekday = weekdayFromDate(date);
  const fixedSlots = FIXED_SCHEDULE[weekday] || [];
  const hard = fixedSlots.map(slot => {
    const occ = fixedOcc(slot);
    return { ...occ, type:'fixed_schedule', message: `Conflito com aula fixa de Bike — ${slot} às ${minToTime(occ.end)}.` };
  });
  const soft = [];

  for(const { lesson, contract } of allLessonsFlat()){
    if(lesson.date !== date) continue;
    if(lesson.id === excludeLessonId) continue;
    if(!lesson.actual_start_time) continue;
    if(!['pre_reservation','confirmed'].includes(lesson.status)) continue;
    const occ = privateOcc(lesson.actual_start_time);
    const label = `${fmtContractNumber(contract.display_number)} — ${contract.client_name}`;
    if(lesson.status === 'confirmed'){
      hard.push({ ...occ, type:'confirmed_lesson', message: `Conflito com reserva confirmada ${label}.` });
    } else {
      soft.push({ ...occ, type:'pre_reservation', message: `Existe uma pré-reserva ${label} neste horário. O horário permanece disponível para negociação.` });
    }
  }

  const requested = timeToMin(baseTime);
  const directHit = hard.find(iv => requested >= iv.start && requested < iv.end);
  let adjusted = requested, wasAdjusted = false;

  if(!directHit){
    for(let i=0;i<4;i++){
      const prepStart = adjusted - PRIVATE_PREP;
      const blocking = hard.find(iv => iv.start < adjusted && iv.end > prepStart && iv.end <= adjusted);
      if(!blocking) break;
      adjusted = blocking.end + PRIVATE_PREP;
      wasAdjusted = true;
    }
  }

  const finalOcc = privateOcc(minToTime(adjusted));
  const hardConflicts = hard.filter(iv => overlaps(finalOcc, iv));
  const softWarnings = soft.filter(iv => overlaps(finalOcc, iv));

  return {
    available: hardConflicts.length === 0,
    requestedBaseTime: baseTime,
    adjustedStartTime: minToTime(adjusted),
    wasAdjusted,
    hardConflicts, softWarnings,
  };
}

/* ---------- notificações derivadas ---------- */
function buildNotifications(){
  const out = [];
  for(const { lesson, contract } of allLessonsFlat()){
    if(!lesson.date) continue;
    const remaining = daysUntil(lesson.date);
    const label = `${fmtContractNumber(contract.display_number)} — ${contract.client_name}`;

    if(lesson.payment.status === 'pending' && remaining <= 5 && lesson.status !== 'completed' && lesson.status !== 'cancelled'){
      out.push({
        type:'payment_deadline', contractId: contract.id, lessonId: lesson.id,
        message: `Pagamento da aula de ${label} está próximo do prazo (5 dias antes da realização).`,
      });
    }
    if(lesson.status === 'confirmed' && remaining < 0){
      out.push({
        type:'lesson_date_passed', contractId: contract.id, lessonId: lesson.id,
        message: `A data da aula ${label} já passou. Deseja atualizar o status?`,
      });
    }
  }
  return out;
}

/* ---------- calendário mensal ---------- */
function renderCalendarView(){
  const year = state.calYear, month = state.calMonth;
  const firstOfMonth = new Date(Date.UTC(year, month, 1, 12));
  const jsStartDow = firstOfMonth.getUTCDay(); // 0=Dom
  const gridStartOffset = jsStartDow === 0 ? 6 : jsStartDow - 1; // quantos dias antes (semana começa segunda)
  const startDate = new Date(Date.UTC(year, month, 1 - gridStartOffset, 12));

  const lessonsByDate = {};
  for(const { lesson, contract } of allLessonsFlat()){
    if(!lesson.date || !ACTIVE_STATUSES.includes(lesson.status)) continue;
    (lessonsByDate[lesson.date] = lessonsByDate[lesson.date] || []).push({ lesson, contract });
  }

  let cells = '';
  for(let i=0;i<42;i++){
    const d = new Date(startDate);
    d.setUTCDate(startDate.getUTCDate() + i);
    const iso = `${d.getUTCFullYear()}-${pad2(d.getUTCMonth()+1)}-${pad2(d.getUTCDate())}`;
    const outside = d.getUTCMonth() !== month;
    const isToday = iso === DEMO_TODAY;
    const dayEvents = lessonsByDate[iso] || [];
    const visible = dayEvents.slice(0,3);
    const extra = dayEvents.length - visible.length;

    cells += `<div class="cal-cell ${outside?'outside':''} ${isToday?'today':''}" ${outside?'':`data-action="open-day" data-date="${iso}"`}>
      <div class="cal-daynum">${d.getUTCDate()}</div>
      ${visible.map(x => `<div class="cal-chip" style="border-color:${clientColor(x.contract.display_number)}">${fmtContractNumber(x.contract.display_number)} ${x.contract.client_name.split(' ')[0]}</div>`).join('')}
      ${extra > 0 ? `<div class="cal-more">+${extra}</div>` : ''}
    </div>`;
  }

  return `
  <div class="cal-wrap">
    <div class="month-nav">
      <button data-action="cal-prev">${ICON.chevLeft}</button>
      <span class="month-label">${MONTH_NAMES[month]} ${year}</span>
      <button data-action="cal-next">${ICON.chevRight}</button>
    </div>
    <div class="cal-grid">
      ${WEEKDAY_ORDER.map(w => `<div class="cal-dow">${WEEKDAY_SHORT[w]}</div>`).join('')}
      ${cells}
    </div>
  </div>`;
}

const GRID_HOURS = ['06:00','07:00','08:00','09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00','19:00','20:00'];

function renderWeekGrid(monday){
  const days = Array.from({length:7}, (_,i) => isoAddDays(monday, i));

  let rows = `<div class="week-row head" style="--cols:7">
    <div class="week-cell"></div>
    ${days.map(iso => {
      const wd = weekdayFromDate(iso);
      const d = new Date(iso+'T00:00:00');
      return `<div class="week-cell week-head-cell">${WEEKDAY_SHORT[wd]}<span class="num">${d.getDate()}</span></div>`;
    }).join('')}
  </div>`;

  for(const hour of GRID_HOURS){
    rows += `<div class="week-row" style="--cols:7"><div class="week-cell week-hour">${hour}</div>`;
    for(const iso of days){
      rows += `<div class="week-cell">${slotForHour(iso, hour)}</div>`;
    }
    rows += `</div>`;
  }

  return `
  <div class="week-toolbar">
    <div class="section-sub">Semana de ${fmtDateBR(monday)} a ${fmtDateBR(isoAddDays(monday,6))}</div>
    <div class="month-nav">
      <button data-action="shift-anchor" data-days="-7">${ICON.chevLeft}</button>
      <button data-action="shift-anchor" data-days="7">${ICON.chevRight}</button>
    </div>
  </div>
  <div class="week-grid scroll-thin">${rows}</div>`;
}

function renderDayList(iso){
  const wd = weekdayFromDate(iso);
  let rows = '';
  for(const hour of GRID_HOURS){
    const info = slotInfoForHour(iso, hour);
    if(info.kind === 'free'){
      rows += `<div class="day-row"><span class="hour">${hour}</span><span class="muted">Livre</span></div>`;
    } else if(info.kind === 'fixed'){
      rows += `<div class="day-row fixed"><span class="hour">${hour}</span><span>Bike (aula fixa)</span></div>`;
    } else {
      rows += `<div class="day-row ${info.status}" style="--client:${info.color}" data-action="open-quick-panel" data-contract="${info.contractId}" data-lesson="${info.lessonId}">
        <span class="hour">${info.displayTime}</span>
        <span>${fmtContractNumber(info.displayNumber)} ${info.clientName} — ${info.status==='confirmed'?'Confirmado':'Pré-reserva'}</span>
      </div>`;
    }
  }
  return `
  <div class="week-toolbar">
    <div class="section-sub">${WEEKDAY_LABEL[wd]}, ${fmtDateBR(iso)}</div>
    <div class="month-nav">
      <button data-action="shift-anchor" data-days="-1">${ICON.chevLeft}</button>
      <button data-action="shift-anchor" data-days="1">${ICON.chevRight}</button>
    </div>
  </div>
  <div class="day-list">${rows}</div>`;
}

function slotInfoForHour(iso, hour){
  const wd = weekdayFromDate(iso);
  const isFixed = (FIXED_SCHEDULE[wd]||[]).includes(hour);
  const evt = allLessonsFlat().find(x => x.lesson.date === iso && (x.lesson.base_time||'').slice(0,5) === hour && ['pre_reservation','confirmed'].includes(x.lesson.status));
  if(evt){
    return {
      kind:'event', status: evt.lesson.status, color: clientColor(evt.contract.display_number),
      contractId: evt.contract.id, lessonId: evt.lesson.id, displayNumber: evt.contract.display_number,
      clientName: evt.contract.client_name, displayTime: (evt.lesson.actual_start_time||hour).slice(0,5),
    };
  }
  if(isFixed) return { kind:'fixed' };
  return { kind:'free' };
}
function slotForHour(iso, hour){
  const info = slotInfoForHour(iso, hour);
  if(info.kind === 'free') return `<div class="slot free">Livre</div>`;
  if(info.kind === 'fixed') return `<div class="slot fixed">Bike</div>`;
  const cls = info.status === 'confirmed' ? 'confirmed' : 'pre';
  return `<div class="slot ${cls}" style="--client:${info.color}" data-action="open-quick-panel" data-contract="${info.contractId}" data-lesson="${info.lessonId}">

    </div>

    <div class="block">

      <div class="complement-row"><span>Fran's Café</span><span>${l.frans_cafe ? 'Sim' : 'Não'}</span></div>
      ${l.complement_notes ? `<p class="text2" style="margin-top:8px;font-size:12.5px">${l.complement_notes}</p>` : ''}

function renderTimeline(notes){
  if(!notes.length) return `<div class="empty-state" style="margin-top:12px">Nenhuma observação registrada ainda.</div>`;
  const sorted = [...notes].sort((a,b) => b.created_at.localeCompare(a.created_at));
  return `<div class="timeline">
    ${sorted.map(n => `<div class="tl-item"><div class="tl-time">${fmtNoteTimestamp(n.created_at)}</div><div class="tl-text">${n.text}</div></div>`).join('')}
  </div>`;
}
function addNoteForm(kind, id){
  return `<form class="add-note" data-action="add-note" data-kind="${kind}" data-id="${id}">
    <input class="input" name="text" placeholder="Adicionar observação..." required />
    <button type="submit" class="btn-secondary">Adicionar</button>
  </form>`;
}

const PAGE_META = {
  home: { title:'Início', sub:'' },
  agenda: { title:'Agenda', sub:'' },
  clientes: { title:'Clientes', sub:'' },
  contract: { title:'Contratação', sub:'' },
  lesson: { title:'Aula', sub:'' },
  grade: { title:'Grade da Bike', sub:'' },
  settings: { title:'Configurações', sub:'' },
};

/* ======================= NOTIFICAÇÕES (drawer) ======================= */
function renderNotifDrawerBody(){
  const notifs = buildNotifications();
  if(!notifs.length) return `<p class="text2" style="font-size:13px">Nenhuma pendência no momento.</p>`;
  return notifs.map(n => `

function bellBadgeCount(){ return buildNotifications().length; }

/* ======================= PAINEL RÁPIDO (evento no calendário) ======================= */
let quickPanelTarget = null;
function renderQuickPanel(){
  if(!quickPanelTarget) return '';
  const ref = getLessonRef(quickPanelTarget.contractId, quickPanelTarget.lessonId);
  if(!ref) return '';
  const { contract:c, lesson:l } = ref;

    <div class="qp-number">${fmtContractNumber(c.display_number)} — ${c.client_name}</div>
    <div class="qp-datetime">${fmtDateBR(l.date)} · ${time}</div>
    <div class="qp-badge">${statusBadge(l.status)}</div>
    <div class="qp-row"><span class="k">Professor</span><span class="v">${l.teacher_id ? teacherName(l.teacher_id) : '—'}</span></div>
    <div class="qp-row"><span class="k">Pagamento</span><span class="v">${PAYMENT_LABEL[l.payment.status]}</span></div>
    <button class="btn-primary qp-open" data-action="open-lesson-from-quickpanel" data-contract="${c.id}" data-lesson="${l.id}">Abrir contratação completa</button>
  `;

/* ======================= MODAL: NOVA CONTRATAÇÃO ======================= */
function renderNewContractModalAvailability(date, time){
  if(!date || !time) return '';
  const result = calcAvailability(date, time);
  let cls = 'avail-ok', msg = 'Horário disponível.';
  if(result.hardConflicts.length){
    cls = 'avail-hard'; msg = result.hardConflicts.map(c=>c.message).join('<br>');
  } else if(result.softWarnings.length){
    cls = 'avail-warn'; msg = result.softWarnings.map(c=>c.message).join('<br>');
  }
  const adjustedNote = result.wasAdjusted ? `<div class="text2" style="margin-top:6px">Horário ajustado automaticamente: ${result.requestedBaseTime} → <strong style="color:var(--text)">${result.adjustedStartTime}</strong></div>` : '';
  return `<div class="avail-box"><span class="${cls}">${msg}</span>${adjustedNote}</div>`;
}


/* ======================= SHELL: cabeçalho, notificação, render principal ======================= */
function render(){
  document.getElementById('content').innerHTML = renderPage();
  updateNavActiveStates();
  updatePageHeader();
  updateBellCount();
}
function activePageGroup(){
  if(state.page === 'contract' || state.page === 'lesson') return 'clientes';
  return state.page;
}
function updateNavActiveStates(){
  const group = activePageGroup();
  document.querySelectorAll('[data-nav]').forEach(el => {
    el.classList.toggle('active', el.dataset.nav === group);
  });
}
function updatePageHeader(){
  const titles = {
    home: ['Início', 'Sua fila de trabalho'],
    agenda: ['Agenda', 'Calendário e ocupação da sala'],
    clientes: ['Clientes', 'Contratações cadastradas'],
    contract: ['Contratação', ''],
    lesson: ['Aula', ''],
    grade: ['Grade da Bike', 'Aulas fixas recorrentes'],
    settings: ['Configurações', ''],
  };
  const [title, sub] = titles[state.page] || ['', ''];
  document.getElementById('page-title').textContent = title;
  document.getElementById('page-sub').textContent = sub;
}
function updateBellCount(){
  const n = bellBadgeCount();
  const el = document.getElementById('bell-count');
  if(n > 0){ el.style.display = 'flex'; el.textContent = n > 9 ? '9+' : String(n); }
  else { el.style.display = 'none'; }
}

/* ---------- overlay / drawers / modal ---------- */
function showOverlay(){ document.getElementById('overlay').classList.add('show'); }
function hideOverlay(){ document.getElementById('overlay').classList.remove('show'); }
function openDrawer(id){ showOverlay(); document.getElementById(id).classList.add('show'); }
function closeAllDrawers(){
  hideOverlay();
  document.querySelectorAll('.drawer.show').forEach(d => d.classList.remove('show'));
  document.getElementById('modal-new-contract').classList.remove('show');
}
function openNotifDrawer(){
  document.getElementById('notif-drawer-body').innerHTML = renderNotifDrawerBody();
  openDrawer('notif-drawer');
}
function openQuickPanel(contractId, lessonId){
  quickPanelTarget = { contractId, lessonId };
  document.getElementById('quick-drawer-body').innerHTML = renderQuickPanel();
  openDrawer('quick-drawer');
}
function openNewContractModal(){
  document.getElementById('ncf-name').value = '';
  document.getElementById('ncf-phone').value = '';
  document.getElementById('ncf-date').value = '';
  document.getElementById('ncf-time').value = '';
  document.getElementById('ncf-avail').innerHTML = '';
  showOverlay();
  document.getElementById('modal-new-contract').classList.add('show');
}
function showToast(msg){
  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(() => el.remove(), 3400);
}

/* ======================= CRIAÇÃO DE CONTRATAÇÃO (em memória, não persistente) ======================= */
function createDemoContract(name, phone, date, time){
  const displayNumber = NEXT_DISPLAY_NUMBER++;
  const contract = {
    id: 'c' + displayNumber, display_number: displayNumber, client_name: name, phone,
    email: '', channel: 'whatsapp', is_member: false, notes: [], lessons: [],
  };
  if(date && time){
    const avail = calcAvailability(date, time);
    contract.lessons.push({
      id: 'l' + displayNumber + 'a', number: 1, date, base_time: time, actual_start_time: avail.adjustedStartTime,
      status: 'interest', teacher_id: null, quote: null, payment: { status:'pending' },
      rooftop:false, frans_cafe:false, complement_notes:'', special_requirements:'',
      notes: [], teacher_checks: {}, feedback: null,
    });
  }
  CONTRACTS.push(contract);
  return contract;
}

/* ======================= DELEGAÇÃO DE EVENTOS ======================= */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if(el){
    const action = el.dataset.action;
    handleAction(action, el, e);
  }
  if(e.target.id === 'overlay'){
    closeAllDrawers();
  }
});

function handleAction(action, el){
  switch(action){
    case 'noop': return; // ações de edição ficam para a Etapa 3 do projeto funcional

    case 'nav-home': go('home'); break;
    case 'nav-agenda': go('agenda'); break;
    case 'nav-clientes': go('clientes'); break;
    case 'nav-grade': go('grade'); break;
    case 'nav-settings': go('settings'); break;
    case 'nav-new-contract': openNewContractModal(); break;

    case 'open-new-contract': openNewContractModal(); break;
    case 'close-modal': closeAllDrawers(); break;

    case 'open-contract': openContract(el.dataset.id); break;
    case 'open-lesson': openLesson(el.dataset.contract, el.dataset.lesson); break;

    case 'agenda-tab':
      state.agendaTab = el.dataset.tab;
      state.agendaView = 'month';
      render();
      break;

    case 'cal-prev':
      state.calMonth--; if(state.calMonth < 0){ state.calMonth = 11; state.calYear--; }
      render(); break;
    case 'cal-next':
      state.calMonth++; if(state.calMonth > 11){ state.calMonth = 0; state.calYear++; }
      render(); break;

    case 'open-day':
      state.detailDate = el.dataset.date;
      state.agendaView = 'detail';
      render(); break;
    case 'cal-back':
      state.agendaView = 'month';
      render(); break;

    case 'avail-date-change':
      state.availWeekStart = el.value;
      render(); break;

    case 'shift-anchor': {
      const days = Number(el.dataset.days);
      if(state.agendaTab === 'disponiveis'){
        state.availWeekStart = isoAddDays(state.availWeekStart, days);
      } else {
        state.detailDate = isoAddDays(state.detailDate || DEMO_TODAY, days);
      }
      render(); break;
    }

    case 'open-quick-panel':
      openQuickPanel(el.dataset.contract, el.dataset.lesson);
      break;
    case 'open-lesson-from-quickpanel':
      closeAllDrawers();
      openLesson(el.dataset.contract, el.dataset.lesson);
      break;

    case 'open-notifications': openNotifDrawer(); break;
    case 'open-contract-from-notif':
      closeAllDrawers();
      openContract(el.dataset.id);
      break;
    case 'close-drawer': closeAllDrawers(); break;

    case 'add-note': break; // tratado no submit do form (ver init())

    default: break;
  }
}

/* ======================= FORMULÁRIOS ======================= */
function initForms(){
  document.getElementById('new-contract-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const name = document.getElementById('ncf-name').value.trim();
    const phone = document.getElementById('ncf-phone').value.trim();
    const date = document.getElementById('ncf-date').value;
    const time = document.getElementById('ncf-time').value;
    if(!name || !phone){ showToast('Nome e telefone são obrigatórios.'); return; }
    const contract = createDemoContract(name, phone, date, time);
    closeAllDrawers();
    showToast(`Contratação ${fmtContractNumber(contract.display_number)} criada (demonstração).`);
    openContract(contract.id);
  });

  ['ncf-date','ncf-time'].forEach(id => {
    document.getElementById(id).addEventListener('input', updateNewContractAvailability);
  });

  document.addEventListener('submit', (e) => {
    const form = e.target.closest('[data-action="add-note"]');
    if(!form) return;
    e.preventDefault();
    const input = form.querySelector('input[name="text"]');
    const text = input.value.trim();
    if(!text) return;
    const kind = form.dataset.kind, id = form.dataset.id;
    const entry = { created_at: new Date().toISOString(), text };
    if(kind === 'contract'){
      const c = getContractById(id);
      if(c) c.notes.push(entry);
    } else {
      for(const c of CONTRACTS){
        const l = c.lessons.find(x => x.id === id);
        if(l){ l.notes.push(entry); break; }
      }
    }
    showToast('Observação adicionada.');
    render();
  });
}
function updateNewContractAvailability(){
  const date = document.getElementById('ncf-date').value;
  const time = document.getElementById('ncf-time').value;
  document.getElementById('ncf-avail').innerHTML = renderNewContractModalAvailability(date, time);
}

/* ======================= RESIZE (grid semanal <-> lista diária) ======================= */
let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if(state.page === 'agenda') render();
  }, 150);
});

/* ======================= ÍCONES (injeção nos placeholders do shell) ======================= */
function initIcons(){
  const map = {
    'bell-icon': ICON.bell,
    'mnav-home': ICON.home, 'mnav-agenda': ICON.calendar, 'mnav-plus': ICON.plus,
    'mnav-grade': ICON.grid, 'mnav-clientes': ICON.users,
    'nav-icon-home': ICON.home, 'nav-icon-agenda': ICON.calendar,
    'nav-icon-clientes': ICON.users, 'nav-icon-grade': ICON.grid, 'nav-icon-settings': ICON.settings,
  };
  Object.entries(map).forEach(([id, svg]) => {
    const el = document.getElementById(id);
    if(el) el.innerHTML = svg;
  });
}

/* ======================= INIT ======================= */
document.addEventListener('DOMContentLoaded', () => {
  initIcons();
  initForms();
  render();
});
